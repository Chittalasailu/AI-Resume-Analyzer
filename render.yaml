databases:
  - name: ai-resume-analyzer-db
    plan: free
    databaseName: ai_resume_analyzer
    user: ai_resume_analyzer

services:
  - type: web
    name: ai-resume-analyzer-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ai-resume-analyzer-sailu1.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-analyzer-db
          property: connectionString
